[package]
name = "herod"
version = "0.1.0"
edition = "2021"
description = "HERO session daemon for ForjaOS"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p"] }
