# F0-008 / FR-001 / FR-008: real switch, upgrade, and rollback in a VM.
# A dedicated test tag is overwritten; :testing and :stable are never changed here.
name: bootc-vm

on:
  pull_request:
    paths:
      - 'image/**'
      - '.github/workflows/bootc-vm.yml'
      - 'scripts/tests/test_bootc_vm_cycle.py'
      - 'scripts/tests/test_bootc_vm_workflow.py'
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * 1'

concurrency:
  group: bootc-vm
  cancel-in-progress: false

jobs:
  vm-cycle:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, MIT
      - name: Install VM host tools from Ubuntu
        run: |
          source_file="$RUNNER_TEMP/forja-ubuntu.sources"
          cat > "$source_file" <<'SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          if ! timeout 15s getent hosts archive.ubuntu.com || \
             ! timeout 15s getent hosts security.ubuntu.com; then
            resolver_target="$(readlink -f /etc/resolv.conf)"
            test "$resolver_target" = /run/systemd/resolve/stub-resolv.conf
            dig +short +time=2 +tries=1 @1.1.1.1 archive.ubuntu.com | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
            dig +short +time=2 +tries=1 @1.1.1.1 security.ubuntu.com | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
            dns_iface="$(ip -o -4 route show default | awk 'NR == 1 {print $5}')"
            test -n "$dns_iface"
            sudo resolvectl dns "$dns_iface" 1.1.1.1
            trap 'sudo resolvectl revert "$dns_iface"' EXIT
            sudo resolvectl flush-caches
            timeout 15s getent hosts archive.ubuntu.com
            timeout 15s getent hosts security.ubuntu.com
          fi
          apt_opts=(-o "Dir::Etc::sourcelist=$source_file" -o "Dir::Etc::sourceparts=/dev/null" -o APT::Update::Error-Mode=any)
          timeout 300s sudo apt-get "${apt_opts[@]}" update
          timeout 600s sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends \
            podman skopeo libvirt-daemon-system libvirt-clients virtinst \
            qemu-system-x86 qemu-utils virtiofsd ovmf btrfs-progs xfsprogs \
            uidmap fuse-overlayfs slirp4netns
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3, Apache-2.0
        with:
          cosign-release: 'v3.1.4'
      - name: Check VM host resources
        run: |
          test -e /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          podman info --format '{{.Host.OCIRuntime.Name}}'
          virsh -c qemu:///session list --all
          free_kib="$(df -Pk / | awk 'NR==2 {print $4}')"
          test "$free_kib" -ge 8388608
          df -h /
          podman pull ghcr.io/ublue-os/bazzite:stable
          podman run --rm --entrypoint /usr/bin/true ghcr.io/ublue-os/bazzite:stable
          probe_id="$(podman run -d --entrypoint /usr/bin/sleep ghcr.io/ublue-os/bazzite:stable 120)"
          trap 'podman rm -f "$probe_id" >/dev/null 2>&1 || true' EXIT
          podman exec "$probe_id" /usr/bin/true
      - name: Build fresh Bazzite VM disk
        run: |
          sudo podman pull ghcr.io/ublue-os/bazzite:stable
          mkdir -p "$RUNNER_TEMP/bazzite-qcow2"
          sudo podman run --rm --privileged --network host \
            --security-opt label=disable \
            --volume "$RUNNER_TEMP/bazzite-qcow2:/output" \
            --volume "$GITHUB_WORKSPACE/image/tests/ci-guest-agent.toml:/config.toml:ro" \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder@sha256:dab86ee6b46dcade411b37f4e70b07d93b6a06da0dbfec6fe89247a220e0d9f8 \
            --type qcow2 --rootfs btrfs ghcr.io/ublue-os/bazzite:stable
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/bazzite-qcow2"
          test -s "$RUNNER_TEMP/bazzite-qcow2/qcow2/disk.qcow2"
      - name: Resolve current signed target
        run: |
          target="$(skopeo inspect --format '{{.Digest}}' docker://ghcr.io/forjaos-project/forjaos:testing)"
          [[ "$target" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "TARGET_DIGEST=$target" >> "$GITHUB_ENV"
        shell: bash
      - name: Boot, switch, upgrade, and rollback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 image/tests/run_bootc_vm_cycle.py \
            --variant forjaos \
            --baseline sha256:cfe6a9791e5bd2226acc48c82cad0e3dcc887662bb9c9ba782a69b646a24f744 \
            --target "$TARGET_DIGEST" \
            --run-id f0-008 \
            --connect qemu:///session \
            --disk "$RUNNER_TEMP/bazzite-qcow2/qcow2/disk.qcow2" \
            --output "$RUNNER_TEMP/bootc-vm-evidence"
      - name: Diagnose guest boot after cycle failure
        if: failure()
        continue-on-error: true
        run: |
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --read-only --connect=/dev/nbd0 "$RUNNER_TEMP/bazzite-qcow2/qcow2/disk.qcow2"
          mount_dir="$(mktemp -d "$RUNNER_TEMP/bazzite-inspect.XXXXXX")"
          trap 'sudo umount "$mount_dir" 2>/dev/null || true; sudo qemu-nbd --disconnect /dev/nbd0' EXIT
          lsblk -f /dev/nbd0
          btrfs_device="$(lsblk -nrpo NAME,FSTYPE /dev/nbd0 | awk '$2 == "btrfs" {print $1; exit}')"
          test -n "$btrfs_device"
          sudo mount -o ro,subvolid=5 "$btrfs_device" "$mount_dir"
          sudo find "$mount_dir" -maxdepth 8 -name 90-forja-vm-ci.conf -print -exec cat {} \;
          sudo find "$mount_dir" -maxdepth 10 -type f -name '*.journal' -print |
            head -n 5 | while IFS= read -r journal_file; do
              sudo journalctl --file "$journal_file" --no-pager -o short-iso 2>/dev/null |
                grep -Ei 'qemu-guest-agent|selinux|avc:|failed to start' | tail -n 120 || true
            done
      - name: Upload VM deployment states
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, MIT
        with:
          name: bootc-vm-evidence
          path: ${{ runner.temp }}/bootc-vm-evidence/*.json
          if-no-files-found: warn
          retention-days: 30
