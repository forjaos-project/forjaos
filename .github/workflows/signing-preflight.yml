# Confirms that the SIGNING_SECRET private key matches the committed cosign.pub (ADR-030, F0-001).
# Runs on demand and on PRs touching the key, the checker or this workflow.
# Third-party actions pinned by commit SHA (both Apache-2.0).
name: signing-preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - cosign.pub
      - scripts/check-signing-key.sh
      - .github/workflows/signing-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: "SIGNING_SECRET corresponde a cosign.pub"
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: scripts/check-signing-key.sh cosign.pub
