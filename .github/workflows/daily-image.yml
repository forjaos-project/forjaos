name: daily-image

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [forjaos, forjaos-nvidia-open]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, MIT
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3, Apache-2.0
        with:
          cosign-release: 'v3.1.4'
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: true
      - name: Build, scan and promote image
        env:
          VARIANT: ${{ matrix.variant }}
          GITHUB_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          LICENSE_REPORT_DIR: ${{ runner.temp }}/licenses
          TRIVY_REPORT_DIR: ${{ runner.temp }}/trivy
        run: bash .github/scripts/daily-image.sh "$VARIANT"
      - name: Upload scan and license reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, MIT
        with:
          name: daily-image-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/trivy/${{ matrix.variant }}/
            ${{ runner.temp }}/licenses/${{ matrix.variant }}/
          if-no-files-found: ignore
          retention-days: 14

  report-inherited-cves:
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, MIT
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, MIT
        continue-on-error: true
        with:
          pattern: daily-image-*
          path: ${{ runner.temp }}/trivy-reports
      - name: Create or update inherited CVE issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          TRIVY_REPORT_DIR: ${{ runner.temp }}/trivy-reports
        run: python3 scripts/report_inherited_cves.py
