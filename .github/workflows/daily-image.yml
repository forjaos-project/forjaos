# F0-003 / ADR-002 / NFR-040: daily tested, signed bootc images.
# :testing is updated only after the image and signature gates pass.
name: daily-image

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: daily-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [forjaos-nvidia-open, forjaos]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'
      - name: Build, test, sign, and publish ${{ matrix.variant }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          LICENSE_REPORT_DIR: ${{ runner.temp }}/licenses
        run: bash .github/scripts/daily-image.sh '${{ matrix.variant }}'
      - name: Upload ${{ matrix.variant }} license inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; MIT
        with:
          name: third-party-licenses-${{ matrix.variant }}
          path: ${{ runner.temp }}/licenses/${{ matrix.variant }}/THIRD_PARTY_LICENSES.md
          if-no-files-found: error
          retention-days: 30

  report_failure:
    needs: image
    if: ${{ always() && needs.image.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the daily image failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          issue_title='F0-003: daily image build failed'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_number="$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "F0-003: daily image build failed") | .number' | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "Daily image build failed: $run_url"
          else
            gh issue create --title "$issue_title" \
              --body "Daily image build failed: $run_url. Check both matrix variants; :testing is updated only after all per-image gates pass."
          fi
