# F1-002 / FR-010 / NFR-011: build and verify both installer ISOs.
# Release publication and physical media validation are separate gates.
name: iso

on:
  pull_request:
    paths:
      - '.github/scripts/build-iso.sh'
      - '.github/workflows/iso.yml'
      - 'image/build_files/installer/Containerfile'
      - 'image/build_files/installer/configure_installer.py'
      - 'scripts/tests/test_installer_config.py'
      - 'scripts/verify-iso.py'
      - 'scripts/tests/test_build_iso.sh'
      - 'scripts/tests/test_verify_iso.py'
      - 'scripts/tests/test_iso_workflow.py'
      - 'docs/install.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [forjaos, forjaos-nvidia-open]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, MIT
      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo btrfs-progs xfsprogs
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3, Apache-2.0
        with:
          cosign-release: 'v3.1.4'
      - name: Build and verify Anaconda ISO
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/iso-$VARIANT"
          bash .github/scripts/build-iso.sh "$VARIANT" "$output"
          python3 scripts/verify-iso.py create "$output/$VARIANT.iso"
          python3 scripts/verify-iso.py check "$output/SHA256SUMS"
          bash scripts/check-signing-key.sh cosign.pub
          CHECK_SIGNING_KEY="${SIGNING_SECRET//$'\r'/}"
          export CHECK_SIGNING_KEY COSIGN_PASSWORD=""
          unset SIGNING_SECRET
          cosign sign-blob --yes --key env://CHECK_SIGNING_KEY \
            --bundle "$output/$VARIANT.iso.sigstore.json" "$output/$VARIANT.iso" >/dev/null
          cosign verify-blob --key cosign.pub \
            --bundle "$output/$VARIANT.iso.sigstore.json" "$output/$VARIANT.iso"
          printf 'ISO bytes: %s\n' "$(stat -c %s "$output/$VARIANT.iso")" >> "$GITHUB_STEP_SUMMARY"
          cat "$output/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified ISO and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, MIT
        with:
          name: iso-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/iso-${{ matrix.variant }}/${{ matrix.variant }}.iso
            ${{ runner.temp }}/iso-${{ matrix.variant }}/SHA256SUMS
            ${{ runner.temp }}/iso-${{ matrix.variant }}/${{ matrix.variant }}.iso.sigstore.json
            ${{ runner.temp }}/iso-${{ matrix.variant }}/THIRD_PARTY_LICENSES.md
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
