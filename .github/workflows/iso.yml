# F1-002 / FR-010 / NFR-011: build and verify both installer ISOs.
# Test ISOs are unsigned. The final release is signed after verification.
name: iso

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Final vX.Y.Z draft from main and stable payload'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [forjaos, forjaos-nvidia-open]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, MIT
      - name: Validate release request
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          REQUEST_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ "$REQUEST_REF" != 'refs/heads/main' ]]; then
              echo 'final release requires main' >&2
              exit 2
            fi
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman skopeo btrfs-progs xfsprogs
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3, Apache-2.0
        with:
          cosign-release: 'v3.1.4'
      - name: Build and verify Anaconda ISO
        env:
          VARIANT: ${{ matrix.variant }}
          IMAGE_CHANNEL: ${{ inputs.release_tag != '' && 'stable' || 'testing' }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/iso-$VARIANT"
          bash .github/scripts/build-iso.sh "$VARIANT" "$output" "$IMAGE_CHANNEL"
          python3 scripts/verify-iso.py create "$output/$VARIANT.iso"
          python3 scripts/verify-iso.py check "$output/SHA256SUMS"
          printf 'ISO bytes: %s\n' "$(stat -c %s "$output/$VARIANT.iso")" >> "$GITHUB_STEP_SUMMARY"
          cat "$output/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign final ISO
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/iso-$VARIANT"
          bash scripts/check-signing-key.sh cosign.pub
          CHECK_SIGNING_KEY="${SIGNING_SECRET//$'\r'/}"
          export CHECK_SIGNING_KEY COSIGN_PASSWORD=""
          unset SIGNING_SECRET
          cosign sign-blob --yes --key env://CHECK_SIGNING_KEY \
            --bundle "$output/$VARIANT.iso.sigstore.json" "$output/$VARIANT.iso" >/dev/null
          cosign verify-blob --key cosign.pub \
            --bundle "$output/$VARIANT.iso.sigstore.json" "$output/$VARIANT.iso"
      - name: Upload verified ISO and proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, MIT
        with:
          name: iso-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/iso-${{ matrix.variant }}/${{ matrix.variant }}.iso
            ${{ runner.temp }}/iso-${{ matrix.variant }}/SHA256SUMS
            ${{ runner.temp }}/iso-${{ matrix.variant }}/${{ matrix.variant }}-grub.cfg
            ${{ runner.temp }}/iso-${{ matrix.variant }}/${{ matrix.variant }}-osbuild-manifest.json
            ${{ runner.temp }}/iso-${{ matrix.variant }}/THIRD_PARTY_LICENSES.md
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload final ISO signature
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, MIT
        with:
          name: iso-signature-${{ matrix.variant }}
          path: ${{ runner.temp }}/iso-${{ matrix.variant }}/${{ matrix.variant }}.iso.sigstore.json
          if-no-files-found: error
          retention-days: 7

  boot:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [forjaos, forjaos-nvidia-open]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, MIT
      - name: Install QEMU and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf tesseract-ocr
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, MIT
        with:
          name: iso-${{ matrix.variant }}
          path: ${{ runner.temp }}/iso-${{ matrix.variant }}
      - name: Boot ISO and detect the ForjaOS installer
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 .github/scripts/smoke-iso-vm.py \
            --iso "$RUNNER_TEMP/iso-$VARIANT/$VARIANT.iso" \
            --output "$RUNNER_TEMP/iso-boot-$VARIANT"
      - name: Upload installer boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, MIT
        with:
          name: iso-boot-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/iso-boot-${{ matrix.variant }}/screen.ppm
            ${{ runner.temp }}/iso-boot-${{ matrix.variant }}/screen-ocr.txt
            ${{ runner.temp }}/iso-boot-${{ matrix.variant }}/serial.log
            ${{ runner.temp }}/iso-boot-${{ matrix.variant }}/qemu.log
          if-no-files-found: warn
          retention-days: 30

  release:
    needs: [build, boot]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, MIT
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, MIT
        with:
          name: iso-forjaos
          path: ${{ runner.temp }}/assets/forjaos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, MIT
        with:
          name: iso-forjaos-nvidia-open
          path: ${{ runner.temp }}/assets/forjaos-nvidia-open
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, MIT
        with:
          name: iso-signature-forjaos
          path: ${{ runner.temp }}/assets/forjaos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, MIT
        with:
          name: iso-signature-forjaos-nvidia-open
          path: ${{ runner.temp }}/assets/forjaos-nvidia-open
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3, Apache-2.0
        with:
          cosign-release: 'v3.1.4'
      - name: Verify and create draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="$RELEASE_TAG"
          title="ForjaOS $tag"
          notes='ISO de instalação por rede. Requer conexão com o GHCR. Publicar após validação física.'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release already exists: $tag" >&2
            exit 1
          fi
          assets="$RUNNER_TEMP/assets"
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          for variant in forjaos forjaos-nvidia-open; do
            cp "$assets/$variant/$variant.iso" "$release_dir/"
            cp "$assets/$variant/$variant.iso.sigstore.json" "$release_dir/"
            cp "$assets/$variant/THIRD_PARTY_LICENSES.md" \
              "$release_dir/THIRD_PARTY_LICENSES-$variant.md"
          done
          cat "$assets/forjaos/SHA256SUMS" \
              "$assets/forjaos-nvidia-open/SHA256SUMS" > "$release_dir/SHA256SUMS"
          python3 scripts/verify-iso.py check "$release_dir/SHA256SUMS"
          for variant in forjaos forjaos-nvidia-open; do
            cosign verify-blob --key cosign.pub \
              --bundle "$release_dir/$variant.iso.sigstore.json" \
              "$release_dir/$variant.iso"
          done
          gh release create "$tag" "$release_dir"/* --draft \
            --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          downloaded="$RUNNER_TEMP/downloaded"
          gh release download "$tag" --dir "$downloaded"
          python3 scripts/verify-iso.py check "$downloaded/SHA256SUMS"
          for variant in forjaos forjaos-nvidia-open; do
            cosign verify-blob --key cosign.pub \
              --bundle "$downloaded/$variant.iso.sigstore.json" \
              "$downloaded/$variant.iso"
          done
