[package]
name = "hero-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"

[dependencies]
rmcp = { version = "3.10.0", features = ["macros", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }
zbus = "5.19"

[[bin]]
name = "hero-system"
path = "src/bin/hero-system.rs"

[[bin]]
name = "hero-desktop"
path = "src/bin/hero-desktop.rs"

[[bin]]
name = "hero-dev"
path = "src/bin/hero-dev.rs"
