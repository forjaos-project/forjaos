# Keep HERO's microphone capture and speech playback on one AEC graph.
# The virtual nodes have low priority so other applications keep their defaults.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      monitor.mode = false
      capture.props = { node.name = "forjaos.hero.aec.capture" }
      source.props = {
        node.name = "forjaos.hero.aec.source"
        node.description = "HERO echo-cancelled microphone"
        priority.session = 1
      }
      sink.props = {
        node.name = "forjaos.hero.aec.sink"
        node.description = "HERO speech playback"
        priority.session = 1
      }
      playback.props = { node.name = "forjaos.hero.aec.playback" }
    }
  }
]
